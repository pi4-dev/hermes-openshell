# Gateway config with the upstream proxy (squid), mounted by docker-compose.proxy.yml
# in place of gateway.toml — keep the settings shared by both files in sync.
[openshell]
version = 2

[openshell.gateway]
compute_driver = "docker"
# /healthz and /readyz are served only on this separate listener.
health_bind_address = "0.0.0.0:8081"

# TLS is disabled and the port is published only on loopback and docker0: user calls (CLI, bootstrap)
# are unauthenticated. Supervisors still authenticate with the JWT keys below.
[openshell.gateway.auth]
allow_unauthenticated_users = true

# Written by the openshell-init service.
[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "hermes-openshell"

[openshell.drivers.docker]
socket_path = "/var/run/docker.sock"
# bridge instead of the default host: supervisor traffic goes through FORWARD/DOCKER-USER,
# so the firewall can enforce "squid only".
supervisor_network_mode = "bridge"

# All sandbox egress (including model requests) -> squid on docker0.
# TOML does not interpolate .env — put the same IP as HOST_BRIDGE_IP here.
https_proxy = "http://172.17.0.1:3128"
no_proxy = "host.openshell.internal,host.docker.internal,localhost,127.0.0.1"
# Without this the supervisor sends CONNECT to the resolved IP address and dstdomain in squid won't match.
proxy_connect_by_hostname = true

# The hermes-sandbox:local image exists only locally — pull only images that are missing.
image_pull_policy = "if_not_present"
# Docker's default AppArmor profile (docker-default) denies mount operations the sandbox
# runtime needs, so the workload container exits during startup. Same as deploy/docker upstream.
app_armor_profile = "Unconfined"
