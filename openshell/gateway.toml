# Gateway config without the upstream proxy. With the proxy enabled, docker-compose.proxy.yml
# mounts gateway.proxy.toml in its place — keep the settings shared by both files in sync.
[openshell]
version = 2

[openshell.gateway]
compute_driver = "docker"

[openshell.drivers.docker]
socket_path = "/var/run/docker.sock"
# bridge instead of the default host: supervisor traffic goes through FORWARD/DOCKER-USER,
# so in proxy mode the firewall can enforce "squid only".
supervisor_network_mode = "bridge"

# The hermes-sandbox:local image exists only locally — set the pull policy so it is not pulled
# (check the allowed values in the Gateway Config reference for your version) or push it to a local registry.
# image_pull_policy = "..."
