name: hermes-openshell

# Base stack: OpenShell gateway (docker driver) + its one-off init (JWT keys) + one-off bootstrap
# (sandboxes), plus the agents chosen with COMPOSE_PROFILES in .env:
#   hermes — model relay + Hermes sandbox image,  claude — Claude Code sandbox image.
# The upstream proxy (squid) is optional and lives in docker-compose.proxy.yml,
# enabled through COMPOSE_FILE in .env (see README).
# The sandbox containers are NOT compose services — the gateway creates them via docker.sock.

services:
  # One-off: writes the sandbox JWT signing keys to /var/lib/openshell/tls (existing keys are kept).
  # The docker driver requires them.
  openshell-init:
    image: ghcr.io/nvidia/openshell/gateway:${OPENSHELL_GATEWAY_TAG}
    user: "0"
    restart: "no"
    command: ["generate-certs", "--output-dir", "/var/lib/openshell/tls"]
    environment:
      HOME: /var/lib/openshell
    volumes:
      - &openshell-data
        # Same path on the host and in the container (the supervisor binary is bind-mounted into sandboxes).
        type: bind
        source: /var/lib/openshell
        target: /var/lib/openshell
        bind:
          create_host_path: true

  openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:${OPENSHELL_GATEWAY_TAG}
    restart: unless-stopped
    depends_on:
      openshell-init:
        condition: service_completed_successfully
    networks: [osnet]
    # The image runs as UID 1000, but dockerd creates /var/lib/openshell on the host as root,
    # so the gateway could not create its database there. Root also covers docker.sock access,
    # which is root-equivalent on the host anyway (same as deploy/docker in the OpenShell repo).
    user: "0"
    ports:
      # Sandboxes call back to host.openshell.internal:8080 -> the port MUST be 8080 on both sides.
      # TLS is disabled = no auth, so it is not exposed on 0.0.0.0.
      - "127.0.0.1:8080:8080"
      - "${HOST_BRIDGE_IP}:8080:8080"
      - "127.0.0.1:8081:8081"           # health: /healthz, /readyz
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.openshell.internal:host-gateway"
    environment:
      OPENSHELL_COMPUTE_DRIVER: docker
      OPENSHELL_DB_URL: sqlite:/var/lib/openshell/openshell.db
      OPENSHELL_DISABLE_TLS: "true"
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      # The extracted supervisor binary ($XDG_DATA_HOME) and the gateway state, including the credential
      # encryption key ($HOME/.local/state), must land on the bind-mounted data directory.
      XDG_DATA_HOME: /var/lib/openshell
      HOME: /var/lib/openshell
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # docker-compose.proxy.yml mounts gateway.proxy.toml over this path.
      - ./openshell/gateway.toml:/etc/openshell/gateway.toml:ro
      - *openshell-data

  # OpenAI-compatible relay in front of the model backend. It holds the API key, the endpoint and
  # the real model name, so Hermes only knows the relay's address and the model alias.
  model-relay:
    profiles: [hermes]
    build: ./model-relay
    restart: unless-stopped
    networks: [osnet]
    ports:
      # Sandboxes reach it as host.docker.internal:8082 (docker0); not exposed on 0.0.0.0.
      - "${HOST_BRIDGE_IP}:8082:8000"
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_NAME: ${MODEL_NAME}

  # Only builds the hermes-sandbox:local image.
  hermes-image:
    profiles: [hermes]
    image: hermes-sandbox:local
    build:
      context: ./hermes
      args:
        HERMES_REF: ${HERMES_REF}
    entrypoint: ["true"]
    restart: "no"

  # Only builds the claude-sandbox:local image.
  claude-image:
    profiles: [claude]
    image: claude-sandbox:local
    build: ./claude
    entrypoint: ["true"]
    restart: "no"

  bootstrap:
    build:
      context: ./bootstrap
      args:
        OPENSHELL_CLI_VERSION: ${OPENSHELL_CLI_VERSION}
    # Services of profiles that are not enabled are skipped (required: false).
    depends_on:
      openshell-gateway:
        condition: service_started
      model-relay:
        condition: service_started
        required: false
      hermes-image:
        condition: service_completed_successfully
        required: false
      claude-image:
        condition: service_completed_successfully
        required: false
    networks: [osnet]
    restart: "no"
    environment:
      NO_PROXY: openshell-gateway
      AGENTS: ${COMPOSE_PROFILES:-}
      SANDBOX_NAME: ${SANDBOX_NAME}
      HERMES_CMD: ${HERMES_CMD}
      CLAUDE_SANDBOX_NAME: ${CLAUDE_SANDBOX_NAME:-claude}
      # Goes to the gateway as the provider credential, never into the sandbox.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ./policy:/policy:ro
      - ./providers:/providers:ro
      - openshell-cli:/root/.config/openshell

networks:
  osnet:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  openshell-cli:
