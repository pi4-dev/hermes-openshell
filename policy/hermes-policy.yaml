# Start from the default policy of your version (Reference -> Default Policy) and compare the
# filesystem/process sections; network_policies below are the Hermes-specific part.
# The model backend does NOT need an entry — the attached provider (bootstrap) adds its rule.
# Binaries are matched by their real path: the base image's Python is uv-managed under
# /sandbox/.uv/python (/usr/local/bin/python3 and the venv pythons are symlinks to it).
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /bin, /sbin, /etc, /opt/hermes, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # Example: Hermes may read GitHub and install packages from PyPI.
  # In proxy mode every host here must also be in squid/whitelist.txt (two independent gates).
  github:
    endpoints:
      - { host: github.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: raw.githubusercontent.com, port: 443 }
    binaries:
      - path: /usr/bin/git
      - path: /sandbox/.uv/python/**
  pypi:
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
    binaries:
      - path: /sandbox/.uv/python/**
