# Startuj od domyślnej polityki swojej wersji (Reference -> Default Policy) i porównaj sekcje
# filesystem/process; network_policies poniżej to część specyficzna dla Hermesa.
# inference.local NIE wymaga wpisu — jest obsługiwane przed oceną polityki.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /bin, /sbin, /etc, /opt/hermes, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # Przykład: Hermes może czytać GitHuba i instalować paczki z PyPI.
  # Każdy host tutaj musi być również w squid/whitelist.txt (dwie niezależne bramki).
  github:
    endpoints:
      - { host: github.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: raw.githubusercontent.com, port: 443 }
    binaries:
      - path: /usr/bin/git
      - path: /usr/bin/python3*        # venv python to symlink -> liczy się realna binarka
      - path: /opt/hermes/.venv/bin/*
  pypi:
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
    binaries:
      - path: /usr/bin/python3*
      - path: /opt/hermes/.venv/bin/*
