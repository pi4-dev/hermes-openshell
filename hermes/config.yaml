# Hermes talks only to inference.local. OpenShell swaps in the model and injects
# the real key outside the sandbox, so both fields below are placeholders.
model:
  provider: custom
  base_url: https://inference.local/v1
  api_key: unused
  default: routed-by-openshell
  context_length: 131072   # set to the model's real context window
